# SDK components this application needs (see ../../touch_rgb/prj.conf for the
# same pattern — the SDK only compiles drivers you switch on here).
# Based on mcuxsdk/mcuxsdk/examples/display_examples/smartdma_camera_flexio_mculcd/prj.conf
# (same camera + FlexIO combination), minus that example's ST7796S panel
# driver component - the panel in hand isn't ST7796S silicon, so
# source/display/lcd_flexio_mculcd.c talks to it directly instead.

# GPIO for the camera sync signals and LCD RST/CS/RS/BLK pins.
CONFIG_MCUX_COMPONENT_driver.gpio=y

# PORT pin muxing used by board_port/pin_mux.c
CONFIG_MCUX_COMPONENT_driver.port=y

# OV7670 camera device driver + SmartDMA capture firmware/driver.
CONFIG_MCUX_COMPONENT_driver.camera-device-ov7670=y
CONFIG_MCUX_COMPONENT_driver.smartdma=y

# J8 FlexIO/LCD header: FlexIO peripheral driver + MCULCD (8080/MIPI-DBI)
# transfer layer. No panel-specific driver component - see above.
CONFIG_MCUX_COMPONENT_driver.flexio=y
CONFIG_MCUX_COMPONENT_driver.flexio_mculcd=y

CONFIG_MCUX_COMPONENT_utility.assert_lite=y
CONFIG_MCUX_COMPONENT_utility.debug_console_lite=y

# No FreeRTOS here on purpose: this mirrors the bare-metal camera capture
# loop in mcuxsdk's own display_examples/smartdma_camera_flexio_mculcd
# example, which this project's camera+display path was adapted from.
